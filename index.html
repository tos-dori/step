<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f0">
  <meta name="description" content="지금 할 일 하나. 로그인 없이 시작하고, 멈췄다가 이어가는 Step!">
  <title>Step! · 지금 하나씩</title>
  <link rel="icon" href="./icons/step.svg" type="image/svg+xml">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./styles/app.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="brand" data-action="home" aria-label="Step! 목록으로"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25h8v-8h7V9h7"/></svg><span>Step<span class="brand-dot">!</span></span></button>
    <span class="tagline">지금 하나씩</span>
    <button class="icon-button" data-action="settings" aria-label="백업·복구와 도움말"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>
  <div id="storage-alert" role="alert" hidden></div>
  <main id="app"></main>
  <footer class="app-footer"><span class="local-dot"></span> 이 브라우저에 저장돼요 <button data-action="settings">백업·복구</button></footer>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="effects" aria-hidden="true"></div>
  <noscript>Step을 사용하려면 JavaScript를 켜 주세요. 로그인은 필요하지 않아요.</noscript>
</body>
</html>
