/* Step minimal: information is edited in place; actions are recognizable by shape. */
*{min-width:0}
html,body,#app,.shell,.rail,.workspace,.list-scroll,.work-scroll{max-width:100%;overflow-x:hidden}
button{flex-shrink:0}
.row-task,.now-card,.list-inner,.work-inner,.detail-area,.date-inline{min-width:0;max-width:100%}
.row-task .row-open{min-width:0;flex:1}
.task-name,.task-note,.now-card h2,.now-card .cue,.run-title{overflow-wrap:anywhere;word-break:break-word}
.section-title{margin-bottom:9px}
.section-title .count{font-size:11px}
.now-card{min-height:126px;padding:17px 20px}
.now-card .now-bottom{justify-content:flex-end;margin-top:8px;font-size:20px}
.now-card .now-bottom .arrow{display:none}
.now-card .cue{margin-top:10px;line-height:1.45}
.now-card .now-line{font-size:12px}
.page-date:empty,.detail-group:empty,.run-note:empty{display:none}
.page-title{font-size:32px}
.page-top{margin-bottom:15px}
.page-date{font-size:12px}
.helper,.notice{font-size:12px}
.detail-group{min-height:0;margin:7px 0 17px}
.inline-field{position:relative;display:flex;flex-direction:column;gap:6px;width:100%;min-width:0}
.inline-field input,.inline-field textarea{border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);width:100%;max-width:100%;padding:8px 10px;margin-left:-10px;resize:none;line-height:1.5;min-width:0;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.inline-field .inline-title{font-size:clamp(25px,3.4vw,36px)!important;font-weight:870;letter-spacing:-.048em;line-height:1.25;padding:9px 10px}
.inline-field textarea{font-size:16px!important;min-height:79px;overflow:auto;overscroll-behavior:contain;white-space:pre-wrap}
.inline-field textarea[readonly]{min-height:64px}
.inline-field input[readonly],.inline-field textarea[readonly]{cursor:text}
.inline-field input[readonly]:hover,.inline-field textarea[readonly]:hover{background:#f5f3ee}
.inline-field.editing input,.inline-field.editing textarea{border-color:#b8b8a9;background:white;outline:0;box-shadow:0 0 0 2px #e4dfc8}
.inline-field .inline-controls{display:none;align-self:flex-end;gap:7px}
.inline-field.editing .inline-controls{display:flex}
.inline-controls button,.date-controls button,.quick-entry button{width:40px;height:40px;min-width:40px;border:0;background:#f1eee7;color:#394139;border-radius:10px;font-size:21px;touch-action:manipulation}
.inline-controls button:first-child,.date-controls button[data-action="dateApply"],.quick-entry button[type="submit"]{background:#f7c955;color:#292e25}
.detail-area{padding:17px 0 18px}
.detail-area>.field-title{display:block;margin-bottom:7px}
.settings-row{min-width:0;max-width:100%}
.settings-row .right{min-width:0;flex-shrink:1}
.settings-row .right strong{overflow-wrap:anywhere;font-size:13px}
.date-inline{padding:10px 0 16px;border-bottom:1px solid var(--line)}
.date-inline .label{display:block;margin-bottom:10px;font-size:13px;color:var(--sub)}
.date-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.date-controls input{height:43px;max-width:100%;min-width:0;border:1px solid #dedbd1;border-radius:9px;background:white;font-size:16px!important;padding:6px}
.date-controls .date-day{width:155px}
.date-controls .date-hour{width:115px}
.date-controls button{width:38px;min-width:38px;height:40px}
.date-controls button[data-action="dateRemove"]{background:none;color:#888b83}
.quick-entry{display:flex;align-items:center;gap:7px;padding:8px 0 14px;min-width:0}
.quick-entry input{width:100%;flex:1;min-width:0;height:46px;font-size:16px!important;border:1px solid #d6d4c8;background:#fffefa;border-radius:12px;padding:10px 12px}
.quick-entry button{width:42px;min-width:42px;height:44px}
.icon-main{font-size:28px!important;font-weight:670!important;height:55px}
.icon-secondary{font-size:25px!important;font-weight:500;min-height:49px}
.action-bar .icon-main{margin-top:4px}
.run-card{margin:24px 0 13px}
.run-card-head{display:none}
.run-note{margin:9px 0}
.note-trigger{font-size:21px;min-height:45px;padding:6px 15px}
.run-note .area{min-height:72px}
.run-cue{padding:12px 15px}
.run-cue p{font-size:16px}
.timer{margin-top:15px}
.timer button{font-size:20px;min-width:46px;min-height:44px}
.run-footer .bar-actions{margin-top:9px}
.run-footer .bar-actions button{font-size:24px}
.result-mark{margin:26px auto 11px}
.result-title:empty{display:none}
.result-actions .icon-main,.result-actions .icon-secondary{min-height:60px}
.work-inner{overflow-wrap:anywhere}
.dialog .modal-actions .btn{min-width:0}
@media(max-width:719px){
 .list-inner{padding:12px 17px 65px}
 .work-inner{padding:7px 18px calc(48px + env(safe-area-inset-bottom))}
 .inline-field .inline-title{font-size:29px!important}
 .date-controls{gap:5px}
 .date-controls .date-day{width:149px}
 .date-controls .date-hour{width:105px}
 .now-card{min-height:125px}
 .row-task{min-width:0}
 .task-note{white-space:normal}
}

.inline-field input,.inline-field textarea{order:0}

.detail-check span{display:block;width:27px;height:27px;border:2px solid #c3c7c0;border-radius:9px}
.detail-check:hover span{border-color:#898e83;background:#f3f1e9}

 border-bottom:1px solid #e7e6df;border-radius:0;
}

</style></head><body><div id="app"><header class="top"><div class="brand">Step<i>!</i></div><div class="top-right"><span class="top-meta" id="syncStatus">계정 연결 중</span><button class="top-link" id="accountButton" aria-label="계정 및 백업">계정</button></div></header><div class="shell"><aside class="rail" id="rail"><nav class="tabs" id="tabs" aria-label="목록 전환"><button class="tab active" data-tab="today">오늘</button><button class="tab" data-tab="all">전체</button></nav><div class="list-scroll" id="listScroll"><div class="list-inner" id="listContent"></div></div><div id="dock"></div></aside><main class="workspace view-detail" id="workspace"><div class="work-scroll" id="workScroll"><div class="work-inner" id="workContent"></div></div></main></div></div><div id="modal" hidden></div><div id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const datePlus=(n)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dayOf=d=>String(d||'').slice(0,10);
const fmt=d=>d?`${Number(d.slice(5,7))}/${Number(d.slice(8,10))}${d.length>10?' '+d.slice(11,16):''}`:'—';
const fullDate=()=>new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
const store='step_v7_live_v1';
const makeTask=(id,title,group,offset,detail={},mode='idle')=>({id,title,group,review:offset===null?'':datePlus(offset),due:detail.dueOffset==null?'':datePlus(detail.dueOffset),memo:detail.memo||'',cue:detail.cue||'',nextDraft:'',phase:mode,doneSteps:detail.doneSteps||0,total:detail.total||1,checks:detail.checks||[false,false,false],done:false});
const initial=()=>({tasks:[],groups:[],activeId:null});
let state;try{const raw=JSON.parse(localStorage.getItem(store));state=raw&&Array.isArray(raw.tasks)&&Array.isArray(raw.groups)?raw:initial()}catch{state=initial()};
let tab='today',view='empty',selected=null,modal='',dateContext=null,reviewIds=[],reviewI=0,prevView='detail',lastView=null,toastT=null,undoState=null,editing=false,scrollPos={today:0,all:0},timerOn=false,timerRemain=1500,timerAt=0,timerDuration=1500,timerEditing=false,adding=false,dateEdit=null,showNote=false;
const task=id=>state.tasks.find(t=>t.id===id),active=()=>task(state.activeId),isReady=t=>t?.doneSteps>=t?.total;
const timerKey="step_v7_timer_v1";
try{const x=JSON.parse(localStorage.getItem(timerKey)||"null");if(x&&Number.isFinite(x.duration)&&x.duration>0){timerDuration=Math.min(10800,x.duration);timerRemain=Math.max(0,Math.min(timerDuration,Number(x.remain)||0));timerOn=!!x.running;timerAt=Number(x.ends)||0}}catch{}
function timerSave(){try{localStorage.setItem(timerKey,JSON.stringify({duration:timerDuration,remain:timerRemain,running:timerOn,ends:timerAt}))}catch{}}
function timerLeft(){return timerOn?Math.max(0,Math.ceil((timerAt-Date.now())/1000)):timerRemain}

function stepControl(t){const n=number(t),min=Math.max(1,t.doneSteps+1);return '<div class="step-count" role="group" aria-label="Step 개수"><button data-action="stepMinus" aria-label="Step 줄이기" '+(t.total>min?'':'disabled')+'>−</button><strong>'+n+'</strong><button data-action="stepPlus" aria-label="Step 늘리기">+</button></div>'}

function save(){
  const serialized=JSON.stringify(state);
  try{localStorage.setItem(store,serialized)}catch(e){alert('이 기기에 데이터를 저장하지 못했습니다. 저장 공간을 확인하세요.');throw e}
  window.StepV7Sync?.changed?.(state);
}
function checkpoint(reason){
 try{
  const n=Number(localStorage.getItem('step_v7_checkpoint_index')||0)%12;
  localStorage.setItem('step_v7_checkpoint_'+n,JSON.stringify({at:Date.now(),reason,state}));
  localStorage.setItem('step_v7_checkpoint_index',String(n+1));
  return true;
 }catch{return false}
}
function transact(fn,msg,canUndo=false){
 const before=JSON.stringify(state);
 if(canUndo&&!checkpoint(msg||'중요 변경')){alert('복구본을 저장하지 못해 작업을 중단했습니다.');return}
 try{fn();save();if(canUndo)undoState=before;render();if(msg)notify(msg,canUndo)}
 catch(e){state=JSON.parse(before);render();console.error(e)}
}
function notify(s,canUndo=false){clearTimeout(toastT);$('#toast').innerHTML=`<div class="toast" role="status"><span>${esc(s)}</span>${canUndo?'<button data-action="undo">되돌리기</button>':''}</div>`;toastT=setTimeout(()=>$('#toast').innerHTML='',3400)}
function phase(t){if(!t||t.done)return '완료';return {'idle':'시작 전','running':'진행 중','paused':'중단됨','choose':'다음 Step 선택','final':'완료 확인'}[t.phase]||'시작 전'}
function number(t){return `${Math.min(t.doneSteps+1,t.total)}/${t.total}`}

function listRow(t){
 const hasStep=t.doneSteps>0||t.total>1||t.phase!=='idle';
 const sub=t.cue||(t.due?'마감 '+fmt(t.due):t.review?.length>10?fmt(t.review):'');
 return '<div class="row-task '+(selected===t.id&&view!=='empty'?'selected':'')+'">'+
 (hasStep?'<span class="task-check has-step"><b>'+number(t)+'</b></span>':'<button class="task-check" data-action="quickDone" data-id="'+esc(t.id)+'" aria-label="'+esc(t.title)+' 완료"><b></b></button>')+
 '<button class="row-open" data-action="open" data-id="'+esc(t.id)+'"><span class="task-name">'+esc(t.title)+'</span>'+(sub?'<span class="task-note">'+esc(sub)+'</span>':'')+'</button>'+
 '<button class="play" data-action="start" data-id="'+esc(t.id)+'" aria-label="'+esc(t.title)+' 시작 또는 재개">▶</button></div>';
}
function currentCard(t){
 return '<button class="now-card '+(t.phase==='paused'?'paused':'')+'" data-action="resume" aria-label="'+esc(t.title)+' 현재 작업 열기">'+
 '<div class="now-line"><span><i class="state-dot"></i>'+phase(t)+'</span><span>'+number(t)+'</span></div>'+
 '<h2>'+esc(t.title)+'</h2>'+(t.cue?'<div class="cue">'+esc(t.cue)+'</div>':'')+
 '<div class="now-bottom"><span aria-hidden="true">▶</span></div></button>';
}
function renderList(){const root=$('#listContent'),pos=$('#listScroll').scrollTop;
const due=state.tasks.filter(t=>!t.done&&dayOf(t.review)===datePlus(0)&&t.id!==state.activeId),old=state.tasks.filter(t=>!t.done&&t.review&&dayOf(t.review)<datePlus(0));const a=active();
let html=`<div class="page-top"><div><h1 class="page-title">${tab==='today'?'오늘':'전체'}</h1><div class="page-date">${tab==='today'?fullDate():''}</div></div><button class="add-button" data-action="add" aria-label="할 일 추가">+</button></div>`;
if(adding)html+='<form id="quickEntry" class="quick-entry"><input id="quickTitle" name="title" maxlength="160" autocomplete="off" placeholder="할 일" aria-label="할 일" required><button type="submit" aria-label="추가">✓</button><button type="button" data-action="cancelAdd" aria-label="닫기">×</button></form>';
if(tab==='today'){if(a&&!a.done)html+=`<div class="section-title">진행 중</div>${currentCard(a)}`;
html+=`<div class="section-title"><span>할 일</span><span class="count">${due.length}개</span></div>${due.length?due.map(listRow).join(''):''}`;
if(old.length)html+=`<div class="section-title">지난 일</div>${old.filter(t=>t.id!==state.activeId).map(listRow).join("")}`;}
else{
const free=state.tasks.filter(t=>!t.done&&t.group==='미분류'&&t.id!==state.activeId);
if(a&&!a.done)html+=`<div class="section-title">진행 중</div>${currentCard(a)}`;
html+=`<div class="section-title">목록 <span class="count">${state.tasks.filter(t=>!t.done).length}개</span></div>`;
for(const group of ['미분류',...state.groups]){const groupTasks=state.tasks.filter(t=>!t.done&&t.group===group&&t.id!==state.activeId);if(group!=='미분류'&&!groupTasks.length)continue;html+=`<div class="group"><div class="group-btn"><span>${esc(group)}</span><span>${groupTasks.length}개</span></div>${groupTasks.map(listRow).join('')}</div>`}

root.innerHTML=html;$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));

if(isMobile()&&view==='empty')$('#listScroll').scrollTop=scrollPos[tab]||0;else $('#listScroll').scrollTop=pos;
}

function navHTML(label,extra=false,back=false){
 return '<div class="work-nav"><div class="split-action">'+(back?'<button class="nav-action" data-action="back" aria-label="뒤로">‹</button>':'')+
 '<span class="nav-title">'+esc(label)+'</span></div><div class="split-action">'+(extra?'<button class="nav-action" data-action="edit" aria-label="기타 설정">⋯</button>':'')+
 '<button class="nav-action close" data-action="close" aria-label="닫기">×</button></div></div>';
}
function inlineField(t,key){
 const v=String(t[key]||'');
 return '<div class="inline-field" data-field="'+key+'"><div class="inline-controls">'+
 '<button type="button" data-action="fieldSave" aria-label="확정">✓</button><button type="button" data-action="fieldCancel" aria-label="취소">×</button></div>'+

}
function dateRow(t,key){
 const open=dateEdit&&dateEdit.id===t.id&&dateEdit.key===key;
 const label=key==="due"?"마감":"날짜",v=String(t[key]||"");
 if(!open)return '<button class="settings-row" data-action="editDate" data-key="'+key+'" data-id="'+esc(t.id)+'"><span class="label">'+label+'</span><span class="right"><strong>'+fmt(v)+'</strong><span class="chev">›</span></span></button>';

function detail(t){
 if(!t)return '<div class="empty-pane"><button class="btn" data-action="add" aria-label="추가">+</button></div>';
 return navHTML('할 일',true)+
 '<div class="detail-heading"><button class="detail-check" data-action="completeTask" aria-label="할 일 완료"><span></span></button>'+inlineField(t,'title')+'</div>'+

 '<section class="detail-area">'+dateRow(t,'review')+dateRow(t,'due')+
 '<button class="settings-row" data-action="editGroup"><span class="label">분류</span><span class="right"><strong>'+esc(t.group||'미분류')+'</strong><span class="chev">›</span></span></button></section>'+
 '<div class="action-bar"><button class="btn primary wide icon-main" data-action="start" data-id="'+esc(t.id)+'" aria-label="'+esc(t.title)+' 시작 또는 재개">▶</button></div>';
}
function run(t){
 const next=t.checks.findIndex(v=>!v);
 return navHTML('Step')+
 '<div class="run-heading"><h1 class="run-title">'+esc(t.title)+'</h1>'+stepControl(t)+'</div>'+
 (t.cue?'<div class="run-cue">'+esc(t.cue)+'</div>':'')+
 '<div class="step-tokens" role="group" aria-label="Step 진행 체크">'+[1,2,3].map((n,i)=>'<button class="step-check '+(t.checks[i]?'done':i===next?'current':'')+'" data-action="check" data-index="'+i+'" aria-label="'+n+' '+(t.checks[i]?'체크 취소':'체크')+'"><span class="num">'+(t.checks[i]?'✓':n)+'</span></button>').join('')+'</div>'+
 '<div class="run-note">'+(showNote||t.nextDraft?'<textarea id="cueInput" class="input area" placeholder="이어할 부분" aria-label="이어할 부분">'+esc(t.nextDraft||'')+'</textarea>':'<button class="note-trigger" data-action="noteToggle" aria-label="이어할 곳 메모">✎</button>')+'</div>'+
 '<section class="timer-card" aria-label="타이머"><div class="timer-top"><span class="timer-label">타이머</span>'+
 (timerEditing?'<div class="timer-edit"><input id="timerMinutes" type="number" min="1" max="180" inputmode="numeric" value="'+Math.ceil(timerDuration/60)+'" aria-label="분"><span>분</span><button data-action="timerApply" aria-label="확정">✓</button><button data-action="timerCancel" aria-label="취소">×</button></div>':'<button class="timer-val" data-action="timerEdit" aria-label="타이머 시간 변경"><span id="timeText"></span></button>')+
 '</div><div class="timer-line"><div id="timerBar"></div></div><div class="timer-buttons"><button data-action="timerReset" aria-label="타이머 초기화">↺</button>'+
 '<button class="timer-toggle" data-action="timer" aria-label="'+(timerOn?'타이머 일시정지':'타이머 시작')+'">'+(timerOn?'Ⅱ':'▶')+'</button></div></section>'+
 '<div class="run-footer"><button class="btn primary wide icon-main" data-action="stepFinish" aria-label="이번 Step 완료">✓</button>'+
 '<div class="run-exit"><button class="btn soft" data-action="pause" aria-label="중단하고 목록으로 돌아가기">Ⅱ <span>중단</span></button>'+
 '<button class="btn soft" data-action="close" aria-label="화면 닫기">× <span>닫기</span></button></div></div>';
}
function result(t){
 return navHTML('Step')+'<div class="result-content"><h1 class="result-title">'+(isReady(t)?'할 일 완료?':'')+'</h1>'+
 '<div class="result-actions">'+(isReady(t)?'<button class="btn primary wide" data-action="completeTask" aria-label="할 일 완료">✓ <span>완료</span></button><button class="btn wide" data-action="moreStep" aria-label="Step 추가">+ <span>Step</span></button>':
 '<button class="btn primary wide" data-action="continue" aria-label="계속">▶</button>')+
 '<button class="btn wide" data-action="close" aria-label="닫기">×</button></div></div>';
}
function review(){const t=task(reviewIds[reviewI]);if(!t)return `${navHTML('지난 일정 확인')}<h1 class="review-title">정리가 끝났어요.</h1>`;return `${navHTML('지난 일정 확인')}<p class="kicker">${reviewI+1} / ${reviewIds.length}</p><h1 class="review-title">언제 다시 볼까요?</h1><div class="review-task">${esc(t.title)}</div>${t.cue?`<div class="next-cue"><div class="field-title">다음 시작점</div><p>${esc(t.cue)}</p></div>`:''}<div class="choice-grid"><button data-action="reviewChoice" data-when="0">오늘</button><button data-action="reviewChoice" data-when="1">내일</button><button data-action="date" data-id="${esc(t.id)}" data-origin="review" data-kind="review">날짜 선택</button><button data-action="reviewChoice" data-when="none">날짜 없이 두기</button></div>`}
function doneList(){const arr=state.tasks.filter(t=>t.done);return `${navHTML('끝낸 일')}<h1 class="detail-title">끝낸 일</h1><div class="completed-rows">${arr.map(t=>`<div class="completed-item"><span>✓</span><strong>${esc(t.title)}</strong><button data-action="restore" data-id="${esc(t.id)}">되돌리기</button></div>`).join('')||'<p class="helper">완료한 일이 아직 없어요.</p>'}</div>`}
function renderWork(force=true){if(!force||editing)return;const t=task(selected),a=active();let html='',style='view-detail';if(view==='detail')html=detail(t);else if(view==='run'&&a){html=run(a);style='view-run'}else if(view==='result'&&a){html=result(a);style='view-result'}else if(view==='review'){html=review();style='view-review'}else if(view==='done')html=doneList();else if(view==='completed'){html=`${navHTML('완료')}<div class="result-mark">✓</div>`;style='view-result'}else{html='<div class="empty-pane"><button class="btn" data-action="add" aria-label="추가">+</button></div>';style='view-empty'}$('#workContent').innerHTML=html;$('#workspace').className=`workspace ${style} ${isMobile()&&view!=='empty'?'mobile-visible':''}`;updateTimer()}
function isMobile(){return window.matchMedia('(max-width:719px)').matches}
function render(preserve=true){const ls=$('#listScroll'),ws=$('#workScroll'),beforeList=ls.scrollTop,beforeWork=ws.scrollTop;renderList();renderWork();$('#rail').classList.toggle('mobile-hidden',isMobile()&&view!=='empty');if(isMobile()&&view==='empty')ls.scrollTop=scrollPos[tab]||0;else ls.scrollTop=beforeList;if(preserve)ws.scrollTop=beforeWork;}

function closeView(){if(isMobile()){view='empty';render();requestAnimationFrame(()=>$('#listScroll').scrollTop=scrollPos[tab]||0)}else{view='empty';render(false)}}
function start(id){const t=task(id);if(!t||t.done)return;if(state.activeId&&state.activeId!==id){const prev=active();if(prev&&prev.phase==='running'){if(!confirm('현재 진행 중인 Step을 중단하고 다른 일을 시작할까요? 진행 기록은 남아요.'))return;prev.phase='paused'}}transact(()=>{state.activeId=t.id;if(t.phase==='idle'||t.phase==='paused')t.phase='running'},'');navigate(isReady(t)||t.phase==='choose'?'result':'run',t.id)}
function saveCue(){const x=active(),field=$('#cueInput');if(field&&x&&field.value!==x.nextDraft){x.nextDraft=field.value.trim();save()}}
function openModal(html,focus){modal='open';$('#modal').hidden=false;$('#modal').innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><div class="modal-bar"><span class="nav-title">Step!</span><button class="nav-action close" type="button" data-action="closeModal" aria-label="닫기">×</button></div>${html}</div>`;if(focus)setTimeout(()=>{try{$(focus)?.focus({preventScroll:true})}catch{}},80)}
function closeModal(){modal='';$('#modal').hidden=true;$('#modal').innerHTML=''}
function modalEdit(t){
 if(!t)return;
 openModal('<h2 class="dialog-title">⋯</h2><form id="editForm" data-id="'+esc(t.id)+'" data-mode="advanced">'+
 '<div class="field"><label for="totalEdit">Step 수</label><input class="input" type="number" min="1" max="30" id="totalEdit" name="total" value="'+t.total+'"></div>'+
 '<div class="modal-actions"><button type="button" class="btn soft" data-action="closeModal" aria-label="닫기">×</button>'+

}
function modalGroup(t){openModal(`<h2 class="dialog-title">분류 변경</h2><p class="helper">할 일이 속한 목록입니다. 진행 상태와는 관계없어요.</p><form id="groupForm"><div class="field"><label for="groupSelect">분류</label><select id="groupSelect" class="input" name="group"><option value="미분류" ${t.group==='미분류'?'selected':''}>미분류</option>${state.groups.map(g=>`<option ${g===t.group?'selected':''} value="${esc(g)}">${esc(g)}</option>`).join('')}</select></div><div class="modal-actions"><button type="button" class="btn soft" data-action="closeModal">취소</button><button type="submit" class="btn dark">적용</button></div></form>`)}
function modalDate(t,kind,origin){dateContext={id:t.id,kind,origin:origin||'detail'};openModal(`<h2 class="dialog-title">${kind==='due'?'마감일':'다시 볼 날'}</h2><p class="helper">${kind==='due'?'반드시 끝내야 하는 날짜예요.':'이 할 일이 다시 오늘 목록에 나타날 날짜예요.'}</p><form id="dateForm"><div class="field"><label for="dateValue">날짜</label><input id="dateValue" class="input" name="date" type="date" value="${t[kind]||datePlus(0)}"></div><div class="modal-actions"><button type="button" class="btn soft" data-action="clearDate">날짜 없음</button><button class="btn dark" type="submit">적용</button></div></form>`,null)}
function chooseDate(v){const ctx=dateContext,t=task(ctx?.id);if(!t)return;transact(()=>{t[ctx.kind]=v;if(ctx.origin==='result'){t.phase='paused';state.activeId=null;}if(ctx.origin==='review'){reviewI++}},'날짜를 변경했어요.');closeModal();if(ctx.origin==='review'){if(reviewI<reviewIds.length)navigate('review');else navigate('empty')}else if(ctx.origin==='result')navigate('empty');else navigate('detail',t.id)}
function afterStep(){
 const t=active();if(!t)return;
 saveCue();
 transact(()=>{
  t.doneSteps=Math.min(t.total,t.doneSteps+1);
  if(t.nextDraft?.trim()){t.cue=t.nextDraft.trim();t.nextDraft=''}
  t.checks=[false,false,false];
  t.phase=isReady(t)?'final':'paused';
  if(t.phase==='paused')state.activeId=null;
 },'');
 timerOn=false;showNote=false;
 if(t.phase==='final')navigate('result');
 else closeView();
}
function finish(){const t=(view==='run'||view==='result')?active():task(selected);if(!t||t.done)return;if(t.phase==='running'&&t.doneSteps<t.total&&!confirm('진행 중이던 할 일을 완료할까요?'))return;transact(()=>{t.done=true;t.phase='done';if(state.activeId===t.id)state.activeId=null},'할 일을 완료했어요.',true);navigate('completed')}
function updateTimer(){const p=$('#timeText');if(p){let left=timerOn?Math.max(0,Math.ceil((timerAt-Date.now())/1000)):timerRemain;p.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(timerOn&&left===0){timerOn=false;timerRemain=1500;notify('타이머가 끝났어요.')}}}
function actions(action,btn){const id=btn?.dataset.id,t=task(id),a=active();switch(action){
case 'add':
 adding=true;renderList();
 requestAnimationFrame(()=>$('#quickTitle')?.focus({preventScroll:true}));
 return;
case 'cancelAdd':adding=false;renderList();return;
case 'fieldSave':{
 const f=btn.closest('.inline-field'),field=f?.dataset.field,x=f?.querySelector('[data-inline]'),item=task(selected);
 if(!f||!x||!item)return;
 const value=x.value.trim();
 if(field==='title'&&!value){x.focus();return}
 if(String(item[field]||'')!==value)transact(()=>{item[field]=value},'');
 else renderWork();
 return;
}
case 'fieldCancel':{
 const f=btn.closest('.inline-field'),field=f?.dataset.field,x=f?.querySelector('[data-inline]'),item=task(selected);
 if(!f||!x||!item)return;
 x.value=String(item[field]||'');x.readOnly=true;f.classList.remove('editing');
 return;
}
case 'editDate':
 dateEdit={id:btn.dataset.id,key:btn.dataset.key};renderWork();
 return;
case 'dateCancel':dateEdit=null;renderWork();return;
case 'dateApply':
case 'dateRemove':{
 const item=task(selected),panel=btn.closest('.date-inline'),kind=panel?.dataset.key;
 if(!item||!kind)return;
 const date=panel.querySelector('.date-day')?.value||'',time=panel.querySelector('.date-hour')?.value||'';
 if(action==='dateApply'&&!date)return;
 const value=action==='dateRemove'?'':date+(time?'T'+time:'');
 dateEdit=null;transact(()=>{item[kind]=value},'');return;
}
case 'noteToggle':
 showNote=true;renderWork();requestAnimationFrame(()=>$('#cueInput')?.focus({preventScroll:true}));return;
case 'closeModal':closeModal();return;case 'close':closeView();return;case 'back':if(view==='run'||view==='result')navigate('detail',state.activeId);else closeView();return;
case 'open':navigate('detail',id);return;case 'start':start(id);return;case 'resume':if(a)start(a.id);return;case 'quickDone':if(!t)return;transact(()=>{t.done=true},'할 일을 완료했어요.',true);return;
case 'edit':modalEdit(task(selected));return;case 'editGroup':modalGroup(task(selected));return;
case 'check':if(!a)return;transact(()=>{const i=Number(btn.dataset.index);a.checks[i]=!a.checks[i]},'');return;
case 'timer':
 if(timerOn){timerRemain=Math.max(0,Math.ceil((timerAt-Date.now())/1000));timerOn=false}else{timerAt=Date.now()+timerRemain*1000;timerOn=true}
 btn.textContent=timerOn?'Ⅱ':'▶';btn.setAttribute('aria-label',timerOn?'타이머 일시정지':'타이머 시작');updateTimer();return;
case 'pause':saveCue();if(a)transact(()=>{a.phase='paused'},'');timerOn=false;showNote=false;closeView();return;
case 'blocked':saveCue();if(a)openModal(`<h2 class="dialog-title">막힌 지점 남기기</h2><p class="helper">다시 시도할 때 무엇부터 확인할지 적어두세요.</p><form id="blockedForm"><div class="field"><label for="blockedCue">다음에 확인할 것</label><textarea id="blockedCue" class="input area" name="cue">${esc(a.cue)}</textarea></div><div class="modal-actions"><button type="button" class="btn soft" data-action="closeModal">취소</button><button type="submit" name="decision" value="pause" class="btn dark">기록하고 중단</button></div><button class="quiet wide" type="button" data-action="blockedContinue">기록하고 계속하기</button></form>`,'#blockedCue');return;
case 'blockedContinue':if(a)transact(()=>{a.cue=$('#blockedCue')?.value.trim()||'';a.nextDraft='';a.phase='running'},'기록했어요.');closeModal();navigate('run');return;
case 'stepFinish':afterStep();return;case 'continue':if(a)transact(()=>{a.phase='running'},'');navigate('run');return;
case 'schedule':if(a){const when=Number(btn.dataset.when);transact(()=>{a.review=datePlus(when);a.phase='paused';state.activeId=null},'다시 볼 날을 정했어요.');navigate('empty')}return;
case 'moreStep':if(a){transact(()=>{a.total+=1;a.phase='running'},'');navigate('run')}return;
case 'completeTask':finish();return;
case 'date':if(task(btn.dataset.id))modalDate(task(btn.dataset.id),btn.dataset.kind,btn.dataset.origin);return;
case 'clearDate':chooseDate('');return;
case 'review':reviewIds=state.tasks.filter(x=>!x.done&&x.review&&dayOf(x.review)<datePlus(0)).map(x=>x.id);reviewI=0;navigate('review');return;
case 'reviewChoice':{const x=task(reviewIds[reviewI]);if(!x)return;transact(()=>{x.review=btn.dataset.when==='none'?'':datePlus(Number(btn.dataset.when));reviewI++},'날짜를 정했어요.');navigate(reviewI<reviewIds.length?'review':'empty');return;}
case 'doneList':navigate('done');return;case 'restore':if(t)transact(()=>{t.done=false;t.phase='idle'},'완료를 취소했어요.',true);return;
case 'delete':if(!t||!confirm('이 할 일을 삭제할까요?'))return;transact(()=>{state.tasks=state.tasks.filter(x=>x.id!==t.id);if(state.activeId===t.id)state.activeId=null},'할 일을 삭제했어요.',true);closeModal();navigate('empty');return;
case 'undo':if(undoState){state=JSON.parse(undoState);undoState=null;save();render();notify('되돌렸어요.')}return;
case 'groups':openModal(`<h2 class="dialog-title">분류</h2>${state.groups.map((g,i)=>`<div class="settings-row"><strong>${esc(g)}</strong><div class="split-action"><button class="edit-text" data-action="renameGroup" data-index="${i}">이름 변경</button><button class="edit-text" data-action="removeGroup" data-index="${i}">삭제</button></div></div>`).join('')}<div class="field"><label for="newGroup">새 분류 추가</label><input id="newGroup" class="input" maxlength="40" placeholder="예: 개인 프로젝트"></div><button type="button" class="btn dark wide" data-action="addGroup">추가</button>`);return;
case 'renameGroup':{const i=Number(btn.dataset.index),name=state.groups[i];if(!name)return;openModal(`<h2 class="dialog-title">분류 이름 변경</h2><form id="renameGroupForm" data-index="${i}"><div class="field"><label for="renameGroupInput">분류 이름</label><input class="input" name="name" maxlength="40" required id="renameGroupInput" value="${esc(name)}"></div><div class="modal-actions"><button type="button" class="btn soft" data-action="closeModal">취소</button><button class="btn dark">저장</button></div></form>`,'#renameGroupInput');return}
case 'removeGroup':{const i=Number(btn.dataset.index),name=state.groups[i];if(!name)return;if(!confirm(`‘${name}’ 분류를 삭제할까요? 그 안의 할 일은 미분류에 남아요.`))return;transact(()=>{state.groups.splice(i,1);state.tasks.forEach(t=>{if(t.group===name)t.group='미분류'})},'분류를 삭제했어요.',true);closeModal();return}
case 'addGroup':{const value=$('#newGroup')?.value.trim();if(value&&!state.groups.includes(value)){transact(()=>state.groups.push(value),'분류를 추가했어요.');closeModal()}return}
}}

$('#listContent').addEventListener('submit',e=>{
 if(e.target.id!=='quickEntry')return;
 e.preventDefault();
 const input=$('#quickTitle'),value=input?.value.trim();
 if(!value)return;
 const item=makeTask('u'+Date.now()+'-'+Math.random().toString(36).slice(2,6),value,'미분류',tab==='today'?0:null);
 adding=false;
 transact(()=>state.tasks.unshift(item),'');
});
$('#workContent').addEventListener('click',e=>{
 const field=e.target.closest('input[data-inline],textarea[data-inline]');
 if(!field||!field.readOnly)return;
 const block=field.closest('.inline-field');
 field.dataset.original=field.value;field.readOnly=false;block?.classList.add('editing');
 field.focus({preventScroll:true});
});
$('#workContent').addEventListener('keydown',e=>{
 const field=e.target.closest('input[data-inline],textarea[data-inline]');
 if(!field||field.readOnly)return;
 if(e.key==='Escape'){e.preventDefault();field.closest('.inline-field')?.querySelector('[data-action="fieldCancel"]')?.click()}
 if(e.key==='Enter'&&field.dataset.inline==='title'){e.preventDefault();field.closest('.inline-field')?.querySelector('[data-action="fieldSave"]')?.click()}
});
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){if(isMobile()&&view==='empty')scrollPos[tab]=$('#listScroll').scrollTop;tab=b.dataset.tab;view='empty';render();requestAnimationFrame(()=>$('#listScroll').scrollTop=scrollPos[tab]||0);return}if(b.dataset.action)actions(b.dataset.action,b)});
$('#modal').addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.action)actions(b.dataset.action,b);else if(e.target.id==='modal')closeModal()});
$('#toast').addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.action)actions(b.dataset.action,b)});
$('#modal').addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='addForm'){const title=String(fd.get('title')||'').trim();if(!title)return;const when=fd.get('when');const newtask=makeTask('u'+Date.now(),title,fd.get('group')||'미분류',when==='today'?0:when==='tomorrow'?1:null,{memo:String(fd.get('memo')||''),dueOffset:null});newtask.due=String(fd.get('due')||'');transact(()=>state.tasks.unshift(newtask),'할 일을 추가했어요.');closeModal();return}
if(f.id==='editForm'){const t=task(f.dataset.id);if(!t)return;transact(()=>{t.total=Math.max(t.doneSteps+1,Math.min(30,Number(fd.get('total'))||t.total))},'');closeModal();return}
if(f.id==='groupForm'){const t=task(selected);if(t)transact(()=>t.group=String(fd.get('group')),'분류를 변경했어요.');closeModal();return}
if(f.id==='renameGroupForm'){const i=Number(f.dataset.index),name=state.groups[i],next=String(fd.get('name')||'').trim();if(name&&next&&!state.groups.includes(next)){transact(()=>{state.groups[i]=next;state.tasks.forEach(t=>{if(t.group===name)t.group=next})},'분류 이름을 바꿨어요.',true)}closeModal();return}
if(f.id==='dateForm'){chooseDate(String(fd.get('date')||''));return}
if(f.id==='blockedForm'){const t=active();if(t)transact(()=>{t.cue=String(fd.get('cue')||'').trim();t.nextDraft='';t.phase='paused'},'막힌 지점을 남겼어요.');closeModal();navigate('empty');return}});
$('#workContent').addEventListener('input',e=>{if(e.target.id==='cueInput'){const a=active();if(a){a.nextDraft=e.target.value;save()}}});
function resize(){const v=window.visualViewport;document.documentElement.style.setProperty('--visible-height',(v?.height||window.innerHeight)+'px');if(!isMobile())$('#rail').classList.remove('mobile-hidden');else $('#rail').classList.toggle('mobile-hidden',view!=='empty');$('#workspace').classList.toggle('mobile-visible',isMobile()&&view!=='empty')}
window.visualViewport?.addEventListener('resize',resize);window.addEventListener('resize',resize);window.addEventListener('pageshow',()=>{resize();render()});
let touchX=0,touchY=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1){touchX=e.touches[0].clientX;touchY=e.touches[0].clientY}},{passive:true});document.addEventListener('touchmove',e=>{if(!e.cancelable||e.touches.length!==1)return;const dy=e.touches[0].clientY-touchY,dx=e.touches[0].clientX-touchX;if(Math.abs(dy)<5||Math.abs(dx)>Math.abs(dy))return;if(e.target.closest('input,textarea,select,[contenteditable]'))return;const sc=e.target.closest('.list-scroll,.work-scroll,.dialog');if(!sc){if(!e.target.closest('input,textarea,select'))e.preventDefault();return}if(dy>0&&sc.scrollTop<=0||dy<0&&sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1)e.preventDefault()},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(adding){adding=false;renderList()}else closeView()}});
setInterval(()=>{if(timerOn)updateTimer()},1000);

// Dedicated production data bridge. Screen changes and remote changes stay independent.
window.StepV7App={
 getState:()=>JSON.parse(JSON.stringify(state)),
 setState:next=>{
  if(!next||!Array.isArray(next.tasks)||!Array.isArray(next.groups))throw Error('Invalid workspace');
  state=JSON.parse(JSON.stringify(next));
  if(state.activeId&&!task(state.activeId))state.activeId=null;
  if(selected&&!task(selected))selected=null;
  if(!selected&&state.tasks.length)selected=state.tasks.find(x=>!x.done)?.id||state.tasks[0].id;
  if(!isMobile()&&view==='empty'&&selected)view='detail';
  if(isMobile()&&view!=='empty')view='empty';
  render(false);resize();
 },
 persistRemote:(next)=>{
  localStorage.setItem(store,JSON.stringify(next));
  window.StepV7App.setState(next);
 },
 exportState:()=>JSON.stringify({tag:'STEP_V7_BACKUP',createdAt:new Date().toISOString(),state},null,2)
};
// If the viewport is narrow, open list first. Wider displays show the sample detail.
if(isMobile())view='empty';render(false);resize();
})();
</script><div id="syncGate" style="position:fixed;z-index:100;inset:0;background:#eeede9;display:flex;align-items:center;justify-content:center;padding:18px">
 <form id="authForm" style="width:min(380px,100%);background:#fffefa;border:1px solid #e9e6dd;border-radius:20px;padding:26px;box-shadow:0 15px 40px #31281312">
  <h2 style="font-size:26px;margin:0 0 9px">Step!</h2>
  <p style="font-size:13px;color:#626961;line-height:1.6;margin:0 0 20px">아이폰·아이패드·맥북에서 같은 할 일을 보려면 동일한 Step 계정으로 로그인하세요.</p>
  <label style="display:block;font-size:13px;margin:12px 0 5px">이메일</label><input type="email" id="authEmail" required autocomplete="username" style="width:100%;min-height:48px;border:1px solid #dcd9ce;border-radius:12px;padding:12px">
  <label style="display:block;font-size:13px;margin:12px 0 5px">비밀번호</label><input type="password" id="authPassword" required autocomplete="current-password" style="width:100%;min-height:48px;border:1px solid #dcd9ce;border-radius:12px;padding:12px">
  <button style="width:100%;height:49px;margin-top:18px;border:0;border-radius:12px;background:#292f29;color:white;font-size:15px;font-weight:750" type="submit">로그인</button>
  <p id="authError" role="alert" style="font-size:12px;color:#965a4c;min-height:18px;margin:12px 0 0"></p>
 </form>
</div>
<div id="syncConflict" hidden style="position:fixed;z-index:110;inset:0;background:#191e1bb0;display:flex;align-items:center;justify-content:center;padding:20px">
 <div style="background:#fffefa;padding:24px;border-radius:18px;max-width:420px;width:100%">
  <h2 style="margin:0 0 12px;font-size:20px">서로 다른 변경이 있어요</h2>
  <p id="syncConflictDescription" style="font-size:13px;line-height:1.6;color:#515650">이 기기와 계정의 할 일 내용이 달라요. 한쪽을 자동으로 덮어쓰지 않았어요.</p>
  <button id="syncUseCloud" type="button" style="display:block;width:100%;min-height:47px;margin:8px 0;border:1px solid #cbd5d0;background:#ecf4ef;border-radius:12px">계정의 내용 사용</button>
  <button id="syncUseLocal" type="button" style="display:block;width:100%;min-height:47px;margin:8px 0;border:1px solid #e5cf8a;background:#fff0c0;border-radius:12px">이 기기의 내용 사용</button>
 </div>
</div><script type="module" src="./sync.js"></script></body></html>
