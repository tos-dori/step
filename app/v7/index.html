<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const datePlus=(n)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=d=>d?`${Number(d.slice(5,7))}월 ${Number(d.slice(8,10))}일`:'없음';
const fullDate=()=>new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
const store='step_v7_live_v1';
const makeTask=(id,title,group,offset,detail={},mode='idle')=>({id,title,group,review:offset===null?'':datePlus(offset),due:detail.dueOffset==null?'':datePlus(detail.dueOffset),memo:detail.memo||'',cue:detail.cue||'',nextDraft:'',phase:mode,doneSteps:detail.doneSteps||0,total:detail.total||1,checks:detail.checks||[false,false,false],done:false});
const initial=()=>({tasks:[],groups:[],activeId:null});
let state;try{const raw=JSON.parse(localStorage.getItem(store));state=raw&&Array.isArray(raw.tasks)&&Array.isArray(raw.groups)?raw:initial()}catch{state=initial()};
let tab='today',view='empty',selected=null,modal='',dateContext=null,reviewIds=[],reviewI=0,prevView='detail',lastView=null,toastT=null,undoState=null,editing=false,scrollPos={today:0,all:0},timerOn=false,timerRemain=1500,timerAt=0;
const task=id=>state.tasks.find(t=>t.id===id),active=()=>task(state.activeId),isReady=t=>t?.doneSteps>=t?.total;
function save(){
  const serialized=JSON.stringify(state);
  try{localStorage.setItem(store,serialized)}catch(e){alert('이 기기에 데이터를 저장하지 못했습니다. 저장 공간을 확인하세요.');throw e}
  window.StepV7Sync?.changed?.(state);
}
function checkpoint(reason){
 try{
  const n=Number(localStorage.getItem('step_v7_checkpoint_index')||0)%12;
  localStorage.setItem('step_v7_checkpoint_'+n,JSON.stringify({at:Date.now(),reason,state}));
  localStorage.setItem('step_v7_checkpoint_index',String(n+1));
  return true;
 }catch{return false}
}
function transact(fn,msg,canUndo=false){
 const before=JSON.stringify(state);
 if(canUndo&&!checkpoint(msg||'중요 변경')){alert('복구본을 저장하지 못해 작업을 중단했습니다.');return}
 try{fn();save();if(canUndo)undoState=before;render();if(msg)notify(msg,canUndo)}
 catch(e){state=JSON.parse(before);render();console.error(e)}
}
function notify(s,canUndo=false){clearTimeout(toastT);$('#toast').innerHTML=`<div class="toast" role="status"><span>${esc(s)}</span>${canUndo?'<button data-action="undo">되돌리기</button>':''}</div>`;toastT=setTimeout(()=>$('#toast').innerHTML='',3400)}
function phase(t){if(!t||t.done)return '완료';return {'idle':'시작 전','running':'진행 중','paused':'중단됨','choose':'다음 Step 선택','final':'완료 확인'}[t.phase]||'시작 전'}
function number(t){return `${Math.min(t.doneSteps+1,t.total)}/${t.total}`}
function listRow(t){const isCurrent=t.id===state.activeId,hasStep=t.doneSteps>0||t.total>1||t.phase!=='idle',subtitle=t.cue?`다음 · ${t.cue}`:t.due?`마감 · ${fmt(t.due)}`:t.group||'';
return `<div class="row-task ${selected===t.id&&view!=='empty'?'selected':''}" data-id="${esc(t.id)}">${hasStep?`<span class="task-check has-step" title="${phase(t)}"><b>${number(t)}</b></span>`:`<button class="task-check" data-action="quickDone" data-id="${esc(t.id)}" aria-label="${esc(t.title)} 완료"><b></b></button>`}<button class="row-open" data-action="open" data-id="${esc(t.id)}"><span class="task-name">${esc(t.title)}</span><span class="task-note ${t.due&&t.due<datePlus(1)?'warning':''}">${esc(subtitle)}</span></button><button class="play" data-action="start" data-id="${esc(t.id)}" aria-label="${esc(t.title)} 실행">▶</button></div>`}
function currentCard(t){return `<button class="now-card ${t.phase==='paused'?'paused':''}" data-action="resume"><div class="now-line"><span><i class="state-dot"></i>${phase(t)}</span><span>${number(t)} Step</span></div><h2>${esc(t.title)}</h2><div class="cue">${esc(t.cue||'다음 시작점을 아직 기록하지 않았어요.')}</div><div class="now-bottom"><span>${t.phase==='paused'?'이어서 하기':t.phase==='running'?'현재 Step으로':isReady(t)?'완료 확인하기':'다음 Step 정하기'}</span><span class="arrow">↗</span></div></button>`}
function renderList(){const root=$('#listContent'),pos=$('#listScroll').scrollTop;
const due=state.tasks.filter(t=>!t.done&&t.review===datePlus(0)&&t.id!==state.activeId),old=state.tasks.filter(t=>!t.done&&t.review&&t.review<datePlus(0));const a=active();
let html=`<div class="page-top"><div><h1 class="page-title">${tab==='today'?'오늘':'전체'}</h1><div class="page-date">${tab==='today'?fullDate():'모든 할 일과 사용자 분류'}</div></div><button class="add-button" data-action="add" aria-label="할 일 추가">+</button></div>`;

else{
const free=state.tasks.filter(t=>!t.done&&t.group==='미분류'&&t.id!==state.activeId);

function navHTML(title,hasEdit=false,back=false){return `<div class="work-nav"><div class="split-action">${back?'<button class="nav-action" data-action="back" aria-label="뒤로">←</button>':''}<span class="nav-title">${title}</span></div><div class="split-action">${hasEdit?'<button class="nav-action" data-action="edit">편집</button>':''}<button class="nav-action close" data-action="close" aria-label="닫기">×</button></div></div>`}
function detail(t){if(!t)return `<div class="empty-pane"><h2>할 일을 선택하세요</h2><p>제목을 누르면 상세 정보를 볼 수 있어요.</p></div>`;
return `${navHTML('할 일 상세',true)}<h1 class="detail-title">${esc(t.title)}</h1><div class="detail-group">${phase(t)} ${t.doneSteps?`· ${number(t)} Step`:''}</div><section class="detail-area"><div class="detail-area-head"><strong class="field-title">메모</strong><button class="edit-text" data-action="editMemo">편집</button></div><p class="detail-memo ${t.memo?'':'detail-placeholder'}">${esc(t.memo||'메모 없음')}</p></section><section class="detail-area"><div class="detail-area-head"><strong class="field-title">다음 시작점</strong><button class="edit-text" data-action="editCue">편집</button></div><div class="next-cue"><p class="${t.cue?'':'detail-placeholder'}">${esc(t.cue||'다음에 할 행동을 남길 수 있어요.')}</p></div></section><section class="detail-area"><button class="settings-row" data-action="date" data-kind="review" data-id="${esc(t.id)}"><span class="label">다시 볼 날</span><span class="right"><strong>${fmt(t.review)}</strong><span class="chev">›</span></span></button><button class="settings-row" data-action="date" data-kind="due" data-id="${esc(t.id)}"><span class="label">마감일</span><span class="right"><strong>${fmt(t.due)}</strong><span class="chev">›</span></span></button><button class="settings-row" data-action="editGroup"><span class="label">분류</span><span class="right"><strong>${esc(t.group||'미분류')}</strong><span class="chev">›</span></span></button></section><div class="action-bar"><button class="btn primary wide" data-action="start" data-id="${esc(t.id)}">▶ ${t.phase==='paused'?'이어서 하기':t.phase==='running'?'현재 Step으로':t.phase==='final'?'완료 확인':t.phase==='choose'?'다음 Step 정하기':'Step 시작'}</button></div><button class="quiet" data-action="completeTask">할 일 자체가 끝났다면 완료</button>`}
function run(t){const labels=['시작할 곳 열기','20분 집중해서 진행하기','다음 시작점 남기기'];const next=t.checks.findIndex(v=>!v);return `${navHTML('Step 실행')}<div class="run-state"><span>● ${phase(t)}</span><span>${number(t)} Step</span></div><h1 class="run-title">${esc(t.title)}</h1><div class="run-cue"><span>지금 여기서 시작</span><p>${esc(t.cue||'가장 작은 행동 하나부터 시작해요.')}</p></div><div class="run-card"><div class="run-card-head">이번 Step <span>체크는 실행 보조용이에요</span></div>${labels.map((txt,i)=>`<button class="step-check ${t.checks[i]?'done':i===next?'current':''}" data-action="check" data-index="${i}"><span class="num">${t.checks[i]?'✓':i+1}</span><span>${txt}</span></button>`).join('')}</div><div class="run-note"><label class="field-label" for="cueInput">이번 Step 이후, 다음에 시작할 위치</label><textarea id="cueInput" class="input area" placeholder="예: 다음에 다시 열 문제나 자료">${esc(t.nextDraft||'')}</textarea></div><div class="timer"><span><b>집중 타이머</b> <span class="timer-val" id="timeText">25:00</span></span><button data-action="timer">${timerOn?'일시정지':'시작'}　›</button></div><div class="run-footer"><button class="btn primary wide" data-action="stepFinish">이번 Step 마침</button><div class="bar-actions"><button class="btn soft" data-action="pause">잠깐 중단</button><button class="btn soft" data-action="blocked">막힘</button></div><button class="quiet" data-action="completeTask">할 일 자체가 끝났다면 완료</button></div>`}
function result(t){const end=isReady(t);return `${navHTML('Step 결과')}<div class="result-mark">✓</div><h1 class="result-title">${end?'이 일 자체도 끝났나요?':'이번 Step을 마쳤어요.'}</h1><p class="helper">${end?'계획한 Step은 처리했어요. 실제로 할 일이 끝났을 때만 완료해 주세요.':'다음에 언제 이어갈지 정하면 그날 다시 나타나요.'}</p>${t.cue?`<div class="next-cue"><div class="field-title">다음 시작점</div><p>${esc(t.cue)}</p></div>`:''}<div class="result-actions">${end?`<button class="btn primary wide" data-action="completeTask">할 일 완료</button><button class="btn wide" data-action="moreStep">아직 할 일이 남았어요</button>`:`<button class="btn primary wide" data-action="continue">지금 이어서 하기</button><div class="bar-actions"><button class="btn" data-action="schedule" data-when="0">오늘 나중에</button><button class="btn" data-action="schedule" data-when="1">내일</button></div><button class="btn wide" data-action="date" data-kind="review" data-id="${esc(t.id)}" data-origin="result">다른 날짜 선택</button>`}</div>`}

function doneList(){const arr=state.tasks.filter(t=>t.done);return `${navHTML('끝낸 일')}<h1 class="detail-title">끝낸 일</h1><div class="completed-rows">${arr.map(t=>`<div class="completed-item"><span>✓</span><strong>${esc(t.title)}</strong><button data-action="restore" data-id="${esc(t.id)}">되돌리기</button></div>`).join('')||'<p class="helper">완료한 일이 아직 없어요.</p>'}</div>`}
function renderWork(force=true){if(!force||editing)return;const t=task(selected),a=active();let html='',style='view-detail';if(view==='detail')html=detail(t);else if(view==='run'&&a){html=run(a);style='view-run'}else if(view==='result'&&a){html=result(a);style='view-result'}else if(view==='review'){html=review();style='view-review'}else if(view==='done')html=doneList();else if(view==='completed'){html=`${navHTML('완료')}<div class="result-mark">✓</div><h1 class="result-title">할 일을 완료했어요.</h1><p class="helper">끝낸 일에서 다시 확인하거나 되돌릴 수 있어요.</p><button class="btn primary wide" data-action="close">목록으로 돌아가기</button>`;style='view-result'}else{html=`<div class="empty-pane"><h2>할 일을 선택하세요</h2><p>왼쪽에서 제목을 눌러 상세 정보를 확인하거나 ▶를 눌러 시작할 수 있어요.</p><button class="btn" data-action="add">+ 할 일 추가</button></div>`;style='view-empty'}$('#workContent').innerHTML=html;$('#workspace').className=`workspace ${style} ${isMobile()&&view!=='empty'?'mobile-visible':''}`;updateTimer()}

function render(preserve=true){const ls=$('#listScroll'),ws=$('#workScroll'),beforeList=ls.scrollTop,beforeWork=ws.scrollTop;renderList();renderWork();$('#rail').classList.toggle('mobile-hidden',isMobile()&&view!=='empty');if(isMobile()&&view==='empty')ls.scrollTop=scrollPos[tab]||0;else ls.scrollTop=beforeList;if(preserve)ws.scrollTop=beforeWork;}

function start(id){const t=task(id);if(!t||t.done)return;if(state.activeId&&state.activeId!==id){const prev=active();if(prev&&prev.phase==='running'){if(!confirm('현재 진행 중인 Step을 중단하고 다른 일을 시작할까요? 진행 기록은 남아요.'))return;prev.phase='paused'}}transact(()=>{state.activeId=t.id;if(t.phase==='idle'||t.phase==='paused')t.phase='running'},'');navigate(isReady(t)||t.phase==='choose'?'result':'run',t.id)}

function modalEdit(t,field='full'){if(!t)return;const extras=field==='cue'?`<div class="field"><label for="cueEdit">다음 시작점</label><textarea id="cueEdit" name="cue" class="input area" placeholder="다음에 할 행동">${esc(t.cue)}</textarea></div>`:field==='memo'?`<div class="field"><label for="memoEdit">메모</label><textarea id="memoEdit" name="memo" class="input area">${esc(t.memo)}</textarea></div>`:`<div class="field"><label for="titleEdit">제목</label><input class="input" name="title" id="titleEdit" value="${esc(t.title)}" required></div><div class="field"><label for="memoEdit">메모</label><textarea class="input area" id="memoEdit" name="memo">${esc(t.memo)}</textarea></div><div class="field"><label for="cueEdit">다음 시작점</label><input class="input" id="cueEdit" name="cue" value="${esc(t.cue)}" placeholder="나중에 바로 시작할 행동"></div><details class="inline-details"><summary>추가 정보</summary><div class="field"><label for="totalEdit">총 Step 수 (선택)</label><input class="input" type="number" min="1" max="30" id="totalEdit" name="total" value="${t.total}"></div></details>`;

function modalDate(t,kind,origin){dateContext={id:t.id,kind,origin:origin||'detail'};openModal(`<h2 class="dialog-title">${kind==='due'?'마감일':'다시 볼 날'}</h2><p class="helper">${kind==='due'?'반드시 끝내야 하는 날짜예요.':'이 할 일이 다시 오늘 목록에 나타날 날짜예요.'}</p><form id="dateForm"><div class="field"><label for="dateValue">날짜</label><input id="dateValue" class="input" name="date" type="date" value="${t[kind]||datePlus(0)}"></div><div class="modal-actions"><button type="button" class="btn soft" data-action="clearDate">날짜 없음</button><button class="btn dark" type="submit">적용</button></div></form>`,null)}

function finish(){const t=(view==='run'||view==='result')?active():task(selected);if(!t||t.done)return;if(t.phase==='running'&&t.doneSteps<t.total&&!confirm('진행 중이던 할 일을 완료할까요?'))return;transact(()=>{t.done=true;t.phase='done';if(state.activeId===t.id)state.activeId=null},'할 일을 완료했어요.',true);navigate('completed')}

function actions(action,btn){const id=btn?.dataset.id,t=task(id),a=active();switch(action){
case 'add':openModal(`<h2 class="dialog-title">할 일 추가</h2><form id="addForm"><div class="field"><label for="addTitle">할 일 제목</label><input class="input" id="addTitle" name="title" required maxlength="160" placeholder="무엇을 해야 하나요?"></div><div class="field"><label for="addWhen">언제 다시 볼까요?</label><select id="addWhen" name="when" class="input"><option value="today" ${tab==='today'?'selected':''}>오늘</option><option value="none" ${tab==='all'?'selected':''}>날짜 없이</option><option value="tomorrow">내일</option></select></div><details class="inline-details"><summary>메모 · 분류 · 마감 추가</summary><div class="field"><label for="addMemo">메모</label><textarea id="addMemo" class="input area" name="memo"></textarea></div><div class="field"><label for="addGroup">분류</label><select id="addGroup" name="group" class="input"><option>미분류</option>${state.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div class="field"><label for="addDue">마감일</label><input id="addDue" class="input" name="due" type="date"></div></details><div class="modal-actions"><button type="button" class="btn soft" data-action="closeModal">취소</button><button type="submit" class="btn dark">추가</button></div></form>`,'#addTitle');return;

case 'pause':saveCue();if(a)transact(()=>{a.phase='paused'},'체크와 다음 시작점을 보존했어요.');timerOn=false;closeView();return;

case 'blockedContinue':if(a)transact(()=>{a.cue=$('#blockedCue')?.value.trim()||'';a.nextDraft='';a.phase='running'},'기록했어요.');closeModal();navigate('run');return;
case 'stepFinish':afterStep();return;case 'continue':if(a)transact(()=>{a.phase='running'},'');navigate('run');return;
case 'schedule':if(a){const when=Number(btn.dataset.when);transact(()=>{a.review=datePlus(when);a.phase='paused';state.activeId=null},'다시 볼 날을 정했어요.');navigate('empty')}return;
case 'moreStep':if(a)transact(()=>{a.total+=1;a.phase='choose'},'Step 하나를 추가했어요.');navigate('result');return;
case 'completeTask':finish();return;
case 'date':if(task(btn.dataset.id))modalDate(task(btn.dataset.id),btn.dataset.kind,btn.dataset.origin);return;
case 'clearDate':chooseDate('');return;
case 'review':reviewIds=state.tasks.filter(x=>!x.done&&x.review&&x.review<datePlus(0)).map(x=>x.id);reviewI=0;navigate('review');return;
case 'reviewChoice':{const x=task(reviewIds[reviewI]);if(!x)return;transact(()=>{x.review=btn.dataset.when==='none'?'':datePlus(Number(btn.dataset.when));reviewI++},'날짜를 정했어요.');navigate(reviewI<reviewIds.length?'review':'empty');return;}
case 'doneList':navigate('done');return;case 'restore':if(t)transact(()=>{t.done=false;t.phase='idle'},'완료를 취소했어요.',true);return;
case 'delete':if(!t||!confirm('이 할 일을 삭제할까요?'))return;transact(()=>{state.tasks=state.tasks.filter(x=>x.id!==t.id);if(state.activeId===t.id)state.activeId=null},'할 일을 삭제했어요.',true);closeModal();navigate('empty');return;
case 'undo':if(undoState){state=JSON.parse(undoState);undoState=null;save();render();notify('되돌렸어요.')}return;
case 'groups':openModal(`<h2 class="dialog-title">분류 관리</h2><p class="helper">분류는 할 일이 속한 목록이에요. 실행 방식과는 관계없어요.</p>${state.groups.map((g,i)=>`<div class="settings-row"><strong>${esc(g)}</strong><div class="split-action"><button class="edit-text" data-action="renameGroup" data-index="${i}">이름 변경</button><button class="edit-text" data-action="removeGroup" data-index="${i}">삭제</button></div></div>`).join('')}<div class="field"><label for="newGroup">새 분류 추가</label><input id="newGroup" class="input" maxlength="40" placeholder="예: 개인 프로젝트"></div><button type="button" class="btn dark wide" data-action="addGroup">추가</button>`);return;
case 'renameGroup':{const i=Number(btn.dataset.index),name=state.groups[i];if(!name)return;openModal(`<h2 class="dialog-title">분류 이름 변경</h2><form id="renameGroupForm" data-index="${i}"><div class="field"><label for="renameGroupInput">분류 이름</label><input class="input" name="name" maxlength="40" required id="renameGroupInput" value="${esc(name)}"></div><div class="modal-actions"><button type="button" class="btn soft" data-action="closeModal">취소</button><button class="btn dark">저장</button></div></form>`,'#renameGroupInput');return}
case 'removeGroup':{const i=Number(btn.dataset.index),name=state.groups[i];if(!name)return;if(!confirm(`‘${name}’ 분류를 삭제할까요? 그 안의 할 일은 미분류에 남아요.`))return;transact(()=>{state.groups.splice(i,1);state.tasks.forEach(t=>{if(t.group===name)t.group='미분류'})},'분류를 삭제했어요.',true);closeModal();return}
case 'addGroup':{const value=$('#newGroup')?.value.trim();if(value&&!state.groups.includes(value)){transact(()=>state.groups.push(value),'분류를 추가했어요.');closeModal()}return}
}}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){if(isMobile()&&view==='empty')scrollPos[tab]=$('#listScroll').scrollTop;tab=b.dataset.tab;view='empty';render();requestAnimationFrame(()=>$('#listScroll').scrollTop=scrollPos[tab]||0);return}if(b.dataset.action)actions(b.dataset.action,b)});
$('#modal').addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.action)actions(b.dataset.action,b);else if(e.target.id==='modal')closeModal()});
$('#toast').addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.action)actions(b.dataset.action,b)});
$('#modal').addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='addForm'){const title=String(fd.get('title')||'').trim();if(!title)return;const when=fd.get('when');const newtask=makeTask('u'+Date.now(),title,fd.get('group')||'미분류',when==='today'?0:when==='tomorrow'?1:null,{memo:String(fd.get('memo')||''),dueOffset:null});newtask.due=String(fd.get('due')||'');transact(()=>state.tasks.unshift(newtask),'할 일을 추가했어요.');closeModal();return}
if(f.id==='editForm'){const t=task(f.dataset.id);if(!t)return;transact(()=>{const mode=f.dataset.mode;if(mode==='full'){t.title=String(fd.get('title')||'').trim()||t.title;t.memo=String(fd.get('memo')||'');t.cue=String(fd.get('cue')||'');t.total=Math.max(t.doneSteps+1,Math.min(30,Number(fd.get('total'))||t.total))}if(mode==='memo')t.memo=String(fd.get('memo')||'');if(mode==='cue')t.cue=String(fd.get('cue')||'')},'저장했어요.');closeModal();return}
if(f.id==='groupForm'){const t=task(selected);if(t)transact(()=>t.group=String(fd.get('group')),'분류를 변경했어요.');closeModal();return}
if(f.id==='renameGroupForm'){const i=Number(f.dataset.index),name=state.groups[i],next=String(fd.get('name')||'').trim();if(name&&next&&!state.groups.includes(next)){transact(()=>{state.groups[i]=next;state.tasks.forEach(t=>{if(t.group===name)t.group=next})},'분류 이름을 바꿨어요.',true)}closeModal();return}
if(f.id==='dateForm'){chooseDate(String(fd.get('date')||''));return}
if(f.id==='blockedForm'){const t=active();if(t)transact(()=>{t.cue=String(fd.get('cue')||'').trim();t.nextDraft='';t.phase='paused'},'막힌 지점을 남겼어요.');closeModal();navigate('empty');return}});
$('#workContent').addEventListener('input',e=>{if(e.target.id==='cueInput'){const a=active();if(a){a.nextDraft=e.target.value;save()}}});
function resize(){const v=window.visualViewport;document.documentElement.style.setProperty('--visible-height',(v?.height||window.innerHeight)+'px');if(!isMobile())$('#rail').classList.remove('mobile-hidden');else $('#rail').classList.toggle('mobile-hidden',view!=='empty');$('#workspace').classList.toggle('mobile-visible',isMobile()&&view!=='empty')}
window.visualViewport?.addEventListener('resize',resize);window.addEventListener('resize',resize);window.addEventListener('pageshow',()=>{resize();render()});
let touchY=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1)touchY=e.touches[0].clientY},{passive:true});document.addEventListener('touchmove',e=>{if(!e.cancelable||e.touches.length!==1)return;const dy=e.touches[0].clientY-touchY;if(Math.abs(dy)<4)return;const sc=e.target.closest('.list-scroll,.work-scroll,.dialog');if(!sc){if(!e.target.closest('input,textarea,select'))e.preventDefault();return}if(dy>0&&sc.scrollTop<=0||dy<0&&sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1)e.preventDefault()},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else closeView()}});
setInterval(()=>{if(timerOn)updateTimer()},1000);

// Dedicated production data bridge. Screen changes and remote changes stay independent.
window.StepV7App={
 getState:()=>JSON.parse(JSON.stringify(state)),
 setState:next=>{
  if(!next||!Array.isArray(next.tasks)||!Array.isArray(next.groups))throw Error('Invalid workspace');
  state=JSON.parse(JSON.stringify(next));
  if(state.activeId&&!task(state.activeId))state.activeId=null;
  if(selected&&!task(selected))selected=null;
  if(!selected&&state.tasks.length)selected=state.tasks.find(x=>!x.done)?.id||state.tasks[0].id;
  if(!isMobile()&&view==='empty'&&selected)view='detail';
  if(isMobile()&&view!=='empty')view='empty';
  render(false);resize();
 },
 persistRemote:(next)=>{
  localStorage.setItem(store,JSON.stringify(next));
  window.StepV7App.setState(next);
 },
 exportState:()=>JSON.stringify({tag:'STEP_V7_BACKUP',createdAt:new Date().toISOString(),state},null,2)
};
// If the viewport is narrow, open list first. Wider displays show the sample detail.
if(isMobile())view='empty';render(false);resize();
})();
</script><div id="syncGate" style="position:fixed;z-index:100;inset:0;background:#eeede9;display:flex;align-items:center;justify-content:center;padding:18px">
 <form id="authForm" style="width:min(380px,100%);background:#fffefa;border:1px solid #e9e6dd;border-radius:20px;padding:26px;box-shadow:0 15px 40px #31281312">
  <h2 style="font-size:26px;margin:0 0 9px">Step!</h2>
  <p style="font-size:13px;color:#626961;line-height:1.6;margin:0 0 20px">아이폰·아이패드·맥북에서 같은 할 일을 보려면 동일한 Step 계정으로 로그인하세요.</p>
  <label style="display:block;font-size:13px;margin:12px 0 5px">이메일</label><input type="email" id="authEmail" required autocomplete="username" style="width:100%;min-height:48px;border:1px solid #dcd9ce;border-radius:12px;padding:12px">
  <label style="display:block;font-size:13px;margin:12px 0 5px">비밀번호</label><input type="password" id="authPassword" required autocomplete="current-password" style="width:100%;min-height:48px;border:1px solid #dcd9ce;border-radius:12px;padding:12px">
  <button style="width:100%;height:49px;margin-top:18px;border:0;border-radius:12px;background:#292f29;color:white;font-size:15px;font-weight:750" type="submit">로그인</button>
  <p id="authError" role="alert" style="font-size:12px;color:#965a4c;min-height:18px;margin:12px 0 0"></p>
 </form>
</div>
<div id="syncConflict" hidden style="position:fixed;z-index:110;inset:0;background:#191e1bb0;display:flex;align-items:center;justify-content:center;padding:20px">
 <div style="background:#fffefa;padding:24px;border-radius:18px;max-width:420px;width:100%">
  <h2 style="margin:0 0 12px;font-size:20px">서로 다른 변경이 있어요</h2>
  <p id="syncConflictDescription" style="font-size:13px;line-height:1.6;color:#515650">이 기기와 계정의 할 일 내용이 달라요. 한쪽을 자동으로 덮어쓰지 않았어요.</p>
  <button id="syncUseCloud" type="button" style="display:block;width:100%;min-height:47px;margin:8px 0;border:1px solid #cbd5d0;background:#ecf4ef;border-radius:12px">계정의 내용 사용</button>
  <button id="syncUseLocal" type="button" style="display:block;width:100%;min-height:47px;margin:8px 0;border:1px solid #e5cf8a;background:#fff0c0;border-radius:12px">이 기기의 내용 사용</button>
 </div>
</div><script type="module" src="./sync.js"></script></body></html>
